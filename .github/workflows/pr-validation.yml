name: Pull Request Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Run for drafts too so cloud-agent / WIP PRs get the same gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate commit messages
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Unit tests
        run: bun run test

      - name: Coverage
        run: bun run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            packages/othello-engine/coverage
            packages/othello-react/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: bun run build

      - name: Check bundle size
        run: |
          shopt -s nullglob
          bundles=(packages/othello-react/dist/assets/index-*.js)
          if [ ${#bundles[@]} -gt 0 ]; then
            BUNDLE_SIZE=$(stat -c%s "${bundles[0]}")
            echo "Bundle size: $BUNDLE_SIZE bytes"
            if [ "$BUNDLE_SIZE" -gt 1048576 ]; then
              echo "::warning::Bundle size ($BUNDLE_SIZE bytes) exceeds 1MB"
            fi
          else
            echo "::warning::No bundle file matched packages/othello-react/dist/assets/index-*.js"
          fi
