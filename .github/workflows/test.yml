name: Run Tests

# Feature-branch pushes only. Pull requests are covered by Pull Request Validation
# to avoid duplicate install/test/build work on every PR synchronize.
on:
  push:
    branches-ignore:
      - main

concurrency:
  group: push-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Vitest 5 requires Node ^22.12.0 || ^24 || >=26. The runner image's
      # default Node is not part of that contract.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run test

      - name: Test build
        run: bun run build
